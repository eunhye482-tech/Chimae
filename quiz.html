<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>연산 퀴즈</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: #f0f2f5;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: white; width: 90%; max-width: 450px; padding: 30px;
            border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;
        }
        .progress { font-size: 18px; color: #888; margin-bottom: 10px; }
        .question { font-size: 48px; font-weight: bold; margin: 20px 0; color: #333; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 30px; }
        .option-btn {
            padding: 20px; font-size: 24px; font-weight: bold; border: 3px solid #eee;
            border-radius: 20px; background: white; cursor: pointer; transition: 0.2s;
        }
        .option-btn:active { background-color: #f0f0f0; transform: scale(0.95); }
        
        /* 정답/오답 효과 */
        .correct { background-color: #55efc4 !important; border-color: #00b894 !important; color: white; }
        .wrong { background-color: #ff7675 !important; border-color: #d63031 !important; color: white; }

        .score-screen { display: none; }
        .score-text { font-size: 24px; margin-bottom: 20px; line-height: 1.6; }
        .home-btn {
            display: inline-block; padding: 15px 30px; background: #74b9ff;
            color: white; text-decoration: none; border-radius: 15px; font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container" id="quiz-container">
    <div class="progress"><span id="current-idx">1</span> / 10</div>
    <div class="question" id="question-text">3 + 5 = ?</div>
    <div class="options-grid" id="options-container">
        </div>
</div>

<div class="container score-screen" id="score-container">
    <h1>결과</h1>
    <p class="score-text" id="result-message"></p>
    <a href="index.html" class="home-btn">처음으로</a>
</div>

<script>
    // URL에서 레벨 값 가져오기 (기본값 1)
    const urlParams = new URLSearchParams(window.location.search);
    const level = parseInt(urlParams.get('lv')) || 1;

    let currentQuestion = 0;
    let score = 0;
    let correctAnswer = 0;

    // 문제 생성 함수
    function generateQuestion() {
        let num1, num2, operator, answer;

        if (level === 1) { // 한자리 더하기 (합 10미만)
            num1 = Math.floor(Math.random() * 5) + 1;
            num2 = Math.floor(Math.random() * 4) + 1;
            operator = '+';
            answer = num1 + num2;
        } else if (level === 2) { // 한자리 빼기
            num1 = Math.floor(Math.random() * 5) + 5;
            num2 = Math.floor(Math.random() * 4) + 1;
            operator = '-';
            answer = num1 - num2;
        } else if (level === 3) { // 두자리 + 한자리 (받아올림X)
            num1 = (Math.floor(Math.random() * 8) + 1) * 10 + Math.floor(Math.random() * 3);
            num2 = Math.floor(Math.random() * 6) + 1;
            operator = '+';
            answer = num1 + num2;
        } else if (level === 4) { // 두자리 - 한자리 (받아내림X)
            num1 = (Math.floor(Math.random() * 8) + 1) * 10 + Math.floor(Math.random() * 5) + 4;
            num2 = Math.floor(Math.random() * 4) + 1;
            operator = '-';
            answer = num1 - num2;
        } else { // 구구단 (2~5단)
            num1 = Math.floor(Math.random() * 4) + 2;
            num2 = Math.floor(Math.random() * 9) + 1;
            operator = '×';
            answer = num1 * num2;
        }

        correctAnswer = answer;
        document.getElementById('question-text').innerText = `${num1} ${operator} ${num2} = ?`;
        makeOptions(answer);
    }

    // 보기 만들기 (중복 없는 4개)
    function makeOptions(correct) {
        let options = [correct];
        while (options.length < 4) {
            let rand = correct + (Math.floor(Math.random() * 11) - 5);
            if (rand >= 0 && !options.includes(rand)) options.push(rand);
        }
        // 보기 섞기
        options.sort(() => Math.random() - 0.5);

        const container = document.getElementById('options-container');
        container.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            container.appendChild(btn);
        });
    }

    // 정답 체크
    function checkAnswer(selected, btn) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true); // 클릭 방지

        if (selected === correctAnswer) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
        }

        setTimeout(() => {
            currentQuestion++;
            if (currentQuestion < 10) {
                document.getElementById('current-idx').innerText = currentQuestion + 1;
                generateQuestion();
            } else {
                showResult();
            }
        }, 800);
    }

    function showResult() {
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('score-container').style.display = 'block';
        document.getElementById('result-message').innerHTML = 
            `참 잘하셨습니다!<br>10문제 중 <b>${score}문제</b>를<br>맞히셨습니다!`;
    }

    // 첫 문제 시작
    generateQuestion();
</script>

</body>
</html>
