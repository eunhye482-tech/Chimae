<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엄마 계산 연습</title>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: #ffffff;
}

.screen {
  width: 100vw;
  height: 100vh;
  padding: 5vh 5vw;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: center;
}

button {
  font-size: 5vw;
  padding: 3vh;
  border-radius: 16px;
}

.menu-btn {
  height: 20vh;
}

#question {
  font-size: 4.8vw;
  line-height: 1.6;
  white-space: pre-line;
}

input {
  font-size: 8vw;
  padding: 2vh;
  text-align: center;
}

.result {
  font-size: 5vw;
}

#count {
  font-size: 4vw;
  color: gray;
}
</style>
</head>

<body>

<div id="menu" class="screen">
  <button class="menu-btn" onclick="startSimple()">단순연산</button>
  <button class="menu-btn" onclick="startMarket()">활용연산</button>
</div>

<div id="game" class="screen" style="display:none;">
  <div id="question"></div>

  <input type="number" id="answer" inputmode="numeric">

  <button onclick="checkAnswer()">확인</button>

  <button onclick="speakQuestion()">🔊 다시 읽어줘</button>

  <div class="result" id="result"></div>
  <div id="count"></div>

  <button onclick="goMenu()">처음으로</button>
</div>

<script>
let mode = "";
let correctAnswer = 0;
let questionCount = 0;
let spokenText = "";

function speak(text) {
  window.speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "ko-KR";
  msg.rate = 0.8;
  window.speechSynthesis.speak(msg);
}

function speakQuestion() {
  speak(spokenText);
}

function goMenu() {
  speechSynthesis.cancel();
  document.getElementById("menu").style.display = "flex";
  document.getElementById("game").style.display = "none";
}

function startSimple() {
  mode = "simple";
  questionCount = 0;
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "flex";
  nextQuestion();
}

function startMarket() {
  mode = "market";
  questionCount = 0;
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "flex";
  nextQuestion();
}

function nextQuestion() {
  if (questionCount >= 30) questionCount = 0;

  document.getElementById("answer").value = "";
  document.getElementById("result").innerText = "";
  questionCount++;

  if (mode === "simple") {
    let a = Math.floor(Math.random() * 90) + 10;
    let b = Math.random() > 0.5
      ? Math.floor(Math.random() * 9) + 1
      : Math.floor(Math.random() * 90) + 10;
    correctAnswer = a + b;
    spokenText = `${a} 더하기 ${b}는 얼마일까요?`;
    document.getElementById("question").innerText = `${a} + ${b} = ?`;
  } else {
    let price = [1000,2000,3000][Math.floor(Math.random()*3)];
    let qty = Math.floor(Math.random() * 3) + 1;
    let paid = 10000;
    correctAnswer = paid - price * qty;
    spokenText =
      `한 단에 ${price}원인 물건을 ${qty}단 샀어요. ` +
      `${paid}원을 받았어요. 잔돈은 얼마일까요?`;
    document.getElementById("question").innerText =
      `한 단에 ${price.toLocaleString()}원\n` +
      `${qty}단 샀어요\n\n` +
      `${paid.toLocaleString()}원 받았어요\n\n` +
      `잔돈은 얼마일까요?`;
  }

  document.getElementById("count").innerText =
    `문제 ${questionCount} / 30`;

  setTimeout(() => speak(spokenText), 500);
}

function checkAnswer() {
  let user = Number(document.getElementById("answer").value);
  if (user === correctAnswer) {
    document.getElementById("result").innerText = "⭕ 잘했어요!";
    speak("잘했어요");
  } else {
    document.getElementById("result").innerText =
      `❌ 정답은 ${correctAnswer}원이에요`;
    speak(`정답은 ${correctAnswer}원이에요`);
  }
  setTimeout(nextQuestion, 3500);
}
</script>

</body>
</html>
