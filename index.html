<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>엄마 계산 연습</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  font-family: Arial, sans-serif;
}

.screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

button {
  width: 90vw;
  height: 20vh;
  font-size: 8vw;
  margin: 3vh 0;
  border-radius: 20px;
}

#question {
  font-size: 7.5vw;
  line-height: 1.4;
  margin-bottom: 4vh;
  white-space: pre-line;
}

input {
  width: 60vw;
  height: 10vh;
  font-size: 9vw;
  text-align: center;
}

.result {
  font-size: 7vw;
  margin-top: 3vh;
}

#count {
  font-size: 5vw;
  margin-top: 2vh;
  color: gray;
}
</style>
</head>

<body>

<div id="menu" class="screen">
  <button onclick="startSimple()">단순연산</button>
  <button onclick="startMarket()">활용연산</button>
</div>

<div id="game" class="screen" style="display:none;">
  <div id="question"></div>
  <input type="number" id="answer" inputmode="numeric">
  <button onclick="checkAnswer()">확인</button>
  <div class="result" id="result"></div>
  <div id="count"></div>
  <button onclick="goMenu()">처음으로</button>
</div>

<script>
let mode = "";
let correctAnswer = 0;
let questionCount = 0;

function goMenu() {
  document.getElementById("menu").style.display = "flex";
  document.getElementById("game").style.display = "none";
}

function startSimple() {
  mode = "simple";
  questionCount = 0;
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "flex";
  nextQuestion();
}

function startMarket() {
  mode = "market";
  questionCount = 0;
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "flex";
  nextQuestion();
}

function nextQuestion() {
  if (questionCount >= 30) questionCount = 0;

  document.getElementById("answer").value = "";
  document.getElementById("result").innerText = "";
  questionCount++;

  if (mode === "simple") {
    let a = Math.floor(Math.random() * 90) + 10;
    let b = Math.random() > 0.5
      ? Math.floor(Math.random() * 9) + 1
      : Math.floor(Math.random() * 90) + 10;
    correctAnswer = a + b;
    document.getElementById("question").innerText =
      `${a} + ${b} = ?`;
  } else {
    let price = [1000,2000,3000][Math.floor(Math.random()*3)];
    let qty = Math.floor(Math.random() * 3) + 1;
    let paid = 10000;
    correctAnswer = paid - price * qty;
    document.getElementById("question").innerText =
      `한 단에 ${price.toLocaleString()}원\n` +
      `${qty}단 샀어요\n\n` +
      `${paid.toLocaleString()}원 받았어요\n\n` +
      `잔돈은 얼마?`;
  }

  document.getElementById("count").innerText =
    `문제 ${questionCount} / 30`;
}

function checkAnswer() {
  let user = Number(document.getElementById("answer").value);
  if (user === correctAnswer) {
    document.getElementById("result").innerText = "⭕ 정답!";
  } else {
    document.getElementById("result").innerText =
      `❌ ${correctAnswer.toLocaleString()}원`;
  }
  setTimeout(nextQuestion, 3000);
}
</script>

</body>
</html>
