<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>연산 단계 선택</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }

        .level-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .level-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
        }

        .level-btn:active {
            transform: scale(0.98);
        }

        /* 레벨별 색상 (눈이 편안한 파스텔 톤) */
        .lv-1 { background-color: #74b9ff; }
        .lv-2 { background-color: #55efc4; }
        .lv-3 { background-color: #fab1a0; }
        .lv-4 { background-color: #a29bfe; }
        .lv-5 { background-color: #fdcb6e; }

        .desc {
            font-size: 14px;
            font-weight: normal;
            opacity: 0.9;
        }

        .back-btn {
            margin-top: 25px;
            display: inline-block;
            color: #888;
            text-decoration: none;
            font-size: 16px;
            border-bottom: 1px solid #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>연산 연습</h1>
    <p>도전할 단계를 선택하세요</p>

    <div class="level-list">
        <button class="level-btn lv-1" onclick="startQuiz(1)">
            <span>1단계</span>
            <span class="desc">한자리 더하기</span>
        </button>
        <button class="level-btn lv-2" onclick="startQuiz(2)">
            <span>2단계</span>
            <span class="desc">한자리 빼기</span>
        </button>
        <button class="level-btn lv-3" onclick="startQuiz(3)">
            <span>3단계</span>
            <span class="desc">더하기 (확장)</span>
        </button>
        <button class="level-btn lv-4" onclick="startQuiz(4)">
            <span>4단계</span>
            <span class="desc">빼기 (확장)</span>
        </button>
        <button class="level-btn lv-5" onclick="startQuiz(5)">
            <span>5단계</span>
            <span class="desc">기초 구구단</span>
        </button>
    </div>

    <a href="index.html" class="back-btn">처음으로 돌아가기</a>
</div>

<script>
    function startQuiz(level) {
        // 선택한 레벨 정보를 주소창에 담아서 문제 풀이 페이지로 넘깁니다.
        location.href = 'quiz.html?lv=' + level;
    }
</script>

</body>
</html>
