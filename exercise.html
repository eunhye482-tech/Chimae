<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>매일 운동 가이드</title>
    <style>
        body {
            margin: 0; padding: 20px;
            font-family: 'Pretendard', sans-serif;
            background-color: #f1f8e9;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: #2e7d32; margin-bottom: 20px; font-size: 28px; text-align: center; }
        
        /* 레벨 선택 버튼 */
        .level-selector {
            display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 500px;
        }
        .lv-tab {
            flex: 1; padding: 15px; border-radius: 15px; border: 2px solid #a5d6a7;
            background: white; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .lv-tab.active { background: #2e7d32; color: white; border-color: #2e7d32; }

        /* 운동 그리드 */
        .exercise-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
            width: 100%; max-width: 500px;
        }
        .ex-btn {
            background: white; border: 1px solid #ddd; border-radius: 20px;
            padding: 20px 10px; font-size: 18px; font-weight: bold; color: #333;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .ex-btn span { font-size: 35px; }
        
        /* 상세 모달 */
        #detail-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; width: 85%; max-width: 400px; border-radius: 30px;
            padding: 30px; text-align: center;
        }
        .modal-content h2 { color: #2e7d32; font-size: 26px; margin-bottom: 10px; }
        .lv-tag { display: inline-block; padding: 5px 15px; border-radius: 15px; font-size: 14px; margin-bottom: 15px; }
        .lv-1-tag { background: #e8f5e9; color: #2e7d32; }
        .lv-2-tag { background: #fff3e0; color: #ef6c00; }
        .lv-3-tag { background: #ffebee; color: #c62828; }
        .modal-content p { font-size: 20px; line-height: 1.6; color: #444; word-break: keep-all; }
        .modal-img { font-size: 90px; margin: 20px 0; }
        .close-btn {
            margin-top: 20px; padding: 15px 40px; background: #2e7d32;
            color: white; border: none; border-radius: 15px; font-size: 20px; font-weight: bold;
        }
        .back-home { margin-top: 30px; color: #666; text-decoration: none; font-size: 18px; }
    </style>
</head>
<body>

<h1>💪 단계별 건강 운동</h1>

<div class="level-selector">
    <button class="lv-tab active" onclick="changeLevel(1)">1단계</button>
    <button class="lv-tab" onclick="changeLevel(2)">2단계</button>
    <button class="lv-tab" onclick="changeLevel(3)">3단계</button>
</div>

<div class="exercise-grid" id="exercise-grid">
    </div>

<a href="main.html" class="back-home">처음으로 돌아가기</a>

<div id="detail-modal">
    <div class="modal-content">
        <div id="modal-lv" class="lv-tag">레벨</div>
        <h2 id="ex-title">운동 이름</h2>
        <div id="ex-img" class="modal-img">🎈</div>
        <p id="ex-desc">설명</p>
        <button class="close-btn" onclick="closeModal()">확인</button>
    </div>
</div>

<script>
    const allExercises = {
        1: [ // 1단계: 앉아서 하는 가벼운 스트레칭
            { title: "목 돌리기", img: "🙆‍♂️", desc: "의자에 앉아 고개를 좌우로 천천히 3번씩 돌리세요." },
            { title: "손바닥 치기", img: "👐", desc: "양손을 세게 10번 마주쳐서 혈액순환을 돕습니다." },
            { title: "기지개 켜기", img: "🙋‍♂️", desc: "깍지를 끼고 손바닥이 하늘을 향하게 쭉 뻗으세요." },
            { title: "손가락 펴기", img: "🤝", desc: "주먹을 꽉 쥐었다가 손가락을 쫙 펴주세요 (10회)." },
            { title: "어깨 으쓱", img: "👕", desc: "어깨를 귀까지 올렸다가 툭 하고 내려놓으세요." },
            { title: "눈 운동", img: "👀", desc: "눈을 감고 시계 방향으로 천천히 눈동자를 돌리세요." },
            { title: "손목 돌리기", img: "🔄", desc: "양손 주먹을 살짝 쥐고 손목을 부드럽게 돌려주세요." },
            { title: "가슴 펴기", img: "흉", desc: "양팔을 벌리며 가슴을 활짝 펴고 깊게 숨 쉬세요." },
            { title: "발가락 꼼지락", img: "🦶", desc: "신발 안에서 발가락을 꽉 쥐었다 폈다 반복하세요." },
            { title: "입 크게 벌리기", img: "😮", desc: "'아-에-이-오-우' 입 모양을 크게 연습하세요." }
        ],
        2: [ // 2단계: 서서 하거나 움직임이 있는 동작
            { title: "제자리 걷기", img: "🚶", desc: "서서 무릎을 높이 들며 제자리에서 20걸음 걸으세요." },
            { title: "벽 짚고 푸쉬업", img: "🏠", desc: "벽을 양손으로 짚고 천천히 굽혔다 펴주세요." },
            { title: "팔 크게 돌리기", img: "🤸", desc: "수영하듯 팔을 앞뒤로 크게 원을 그리며 돌리세요." },
            { title: "몸통 비틀기", img: "🔄", desc: "양손을 허리에 대고 상체를 좌우로 천천히 돌리세요." },
            { title: "뒷꿈치 들기", img: "⬆️", desc: "의자를 잡고 뒷꿈치를 높이 들었다가 천천히 내리세요." },
            { title: "만세 하기", img: "🙌", desc: "양팔을 번갈아 가며 하늘 위로 높이 뻗어주세요." },
            { title: "무릎 당기기", img: "🦵", desc: "한쪽 무릎을 가슴 쪽으로 최대한 당겨 3초간 버티세요." },
            { title: "손뼉 뒤로 치기", img: "👏", desc: "등 뒤에서 양손 손뼉을 쳐보세요. 어깨에 좋습니다." },
            { title: "허리 옆으로", img: "🤸‍♂️", desc: "한 손을 머리 위로 올리고 몸을 옆으로 쭉 늘리세요." },
            { title: "엉덩이 치기", img: "🍑", desc: "손바닥으로 엉덩이를 가볍게 두드리며 긴장을 푸세요." }
        ],
        3: [ // 3단계: 근력과 균형 감각 강화
            { title: "의자 스쿼트", img: "🪑", desc: "의자에 앉는 척하다가 다시 일어나는 동작을 10번 하세요." },
            { title: "한 발 서기", img: "🧍", desc: "의자를 살짝 잡고 한 발로 10초간 균형을 잡아보세요." },
            { title: "무릎 높이 들기", img: "🏃", desc: "허벅지가 바닥과 수평이 될 때까지 높이 들며 걸으세요." },
            { title: "팔자 걸음", img: "👣", desc: "앞꿈치와 뒷꿈치를 일직선상에 두고 천천히 걸으세요." },
            { title: "런지 동작", img: "🧘‍♂️", desc: "한 발을 크게 앞으로 내딛고 무릎을 살짝 굽혔다 일어나세요." },
            { title: "등 근육 조이기", img: "🦅", desc: "양팔을 'W'자로 만들어 등 뒤 날개뼈를 꽉 조이세요." },
            { title: "수평 잡기", img: "✈️", desc: "팔을 벌리고 상체를 숙여 'T'자 모양을 5초간 유지하세요." },
            { title: "빠르게 걷기", img: "💨", desc: "평소보다 조금 더 빠른 걸음으로 1분간 제자리 걸음 하세요." },
            { title: "앉았다 일어나기", img: "⚡", desc: "의자 없이 벽에 등을 기대고 투명 의자 자세를 해보세요." },
            { title: "그림자 복싱", img: "🥊", desc: "허공에 가볍게 주먹을 내지르며 전신을 움직이세요." }
        ]
    };

    let currentLevel = 1;

    function changeLevel(lv) {
        currentLevel = lv;
        // 탭 스타일 변경
        const tabs = document.querySelectorAll('.lv-tab');
        tabs.forEach((tab, idx) => {
            if (idx + 1 === lv) tab.classList.add('active');
            else tab.classList.remove('active');
        });
        renderExercises();
    }

    function renderExercises() {
        const grid = document.getElementById('exercise-grid');
        grid.innerHTML = '';
        allExercises[currentLevel].forEach((ex, index) => {
            const btn = document.createElement('button');
            btn.className = 'ex-btn';
            btn.innerHTML = `<span>${ex.img}</span>${ex.title}`;
            btn.onclick = () => showDetail(index);
            grid.appendChild(btn);
        });
    }

    function showDetail(index) {
        const ex = allExercises[currentLevel][index];
        const modal = document.getElementById('detail-modal');
        const lvTag = document.getElementById('modal-lv');
        
        document.getElementById('ex-title').innerText = ex.title;
        document.getElementById('ex-img').innerText = ex.img;
        document.getElementById('ex-desc').innerText = ex.desc;
        
        lvTag.innerText = currentLevel + "단계 운동";
        lvTag.className = "lv-tag lv-" + currentLevel + "-tag";
        
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('detail-modal').style.display = 'none';
    }

    // 처음 시작 시 1단계 렌더링
    renderExercises();
</script>

</body>
</html>
